<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sorteo Focus - Directo 19 Mayo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #070707;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .title {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 28px;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 40px;
    }
    .count {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #0088FF;
      margin-bottom: 40px;
    }

    /* Slot machine effect */
    .slot-wrapper {
      height: 100px;
      overflow: hidden;
      position: relative;
      margin-bottom: 40px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot-wrapper::before,
    .slot-wrapper::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 30px;
      z-index: 2;
      pointer-events: none;
    }
    .slot-wrapper::before { top: 0; background: linear-gradient(to bottom, #070707, transparent); }
    .slot-wrapper::after { bottom: 0; background: linear-gradient(to top, #070707, transparent); }

    .slot-names {
      transition: transform 0.1s linear;
      width: 100%;
    }
    .slot-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 32px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* Winner display */
    .winner-section {
      display: none;
    }
    .winner-section.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }
    .winner-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 42px;
      color: #25D366;
      margin-bottom: 12px;
      text-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
    }
    .winner-label {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    /* Phone reveal */
    .phone-section {
      display: none;
      margin-top: 20px;
    }
    .phone-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    .phone-number {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #0088FF;
      background: rgba(0, 136, 255, 0.08);
      border: 1px solid rgba(0, 136, 255, 0.2);
      border-radius: 12px;
      padding: 16px 24px;
      display: inline-block;
    }

    /* Buttons */
    .btn {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 16px;
      padding: 18px 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-block;
    }
    .btn-sorteo {
      background: #25D366;
      color: #fff;
      box-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
      width: 100%;
      max-width: 320px;
    }
    .btn-sorteo:hover { background: #20bd5a; transform: scale(1.02); }
    .btn-sorteo:active { transform: scale(0.98); }

    .btn-phone {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
      padding: 12px 24px;
      margin-top: 20px;
    }
    .btn-phone:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .btn-again {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
      padding: 14px 30px;
      margin-top: 24px;
    }
    .btn-again:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: fall 3s linear forwards;
      z-index: 100;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hidden initially */
    .pre-sorteo { display: block; }
    .post-sorteo { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- PRE SORTEO -->
    <div class="pre-sorteo" id="preSorteo">
      <div class="title">SORTEO EN DIRECTO</div>
      <div class="subtitle">Consultoría 1-a-1 con Adrián</div>
      <div class="count" id="participantCount"></div>
      <div class="slot-wrapper" id="slotWrapper" style="display:none;">
        <div class="slot-names" id="slotNames"></div>
      </div>
      <button class="btn btn-sorteo" id="btnSortear" onclick="startRaffle()">
        SORTEAR GANADOR
      </button>
    </div>

    <!-- POST SORTEO -->
    <div class="post-sorteo" id="postSorteo">
      <div class="winner-label">EL GANADOR ES</div>
      <div class="winner-name" id="winnerName"></div>
      
      <button class="btn btn-phone" id="btnPhone" onclick="revealPhone()">
        Ver número de teléfono
      </button>

      <div class="phone-section" id="phoneSection">
        <div class="phone-number" id="winnerPhone"></div>
      </div>

      <br>
      <button class="btn btn-again" onclick="resetRaffle()">
        Sortear otro
      </button>
    </div>
  </div>

    document.getElementById('participantCount').textContent = DATA.length + ' participantes';

    let winner = null;

    function startRaffle() {
      const btn = document.getElementById('btnSortear');
      btn.disabled = true;
      btn.textContent = 'SORTEANDO...';
      btn.style.opacity = '0.6';

      const slotWrapper = document.getElementById('slotWrapper');
      const slotNames = document.getElementById('slotNames');
      slotWrapper.style.display = 'flex';

      // Animate through random names
      let iterations = 0;
      const maxIterations = 30;
      let speed = 50;

      function animate() {
        const randomIdx = Math.floor(Math.random() * DATA.length);
        slotNames.innerHTML = '<div class="slot-name">' + DATA[randomIdx].name + '</div>';
        iterations++;

        if (iterations < maxIterations) {
          speed += 15;
          setTimeout(animate, speed);
        } else {
          // Pick winner
          winner = DATA[Math.floor(Math.random() * DATA.length)];
          slotNames.innerHTML = '<div class="slot-name">' + winner.name + '</div>';
          
          setTimeout(() => {
            document.getElementById('preSorteo').style.display = 'none';
            document.getElementById('postSorteo').style.display = 'block';
            document.getElementById('winnerName').textContent = winner.name;
            document.getElementById('phoneSection').classList.remove('active');
            document.getElementById('btnPhone').style.display = 'inline-block';
            launchConfetti();
          }, 800);
        }
      }

      animate();
    }

    function revealPhone() {
      if (!winner) return;
      document.getElementById('phoneSection').classList.add('active');
      document.getElementById('winnerPhone').textContent = winner.whatsapp;
      document.getElementById('btnPhone').style.display = 'none';
    }

    function resetRaffle() {
      document.getElementById('preSorteo').style.display = 'block';
      document.getElementById('postSorteo').style.display = 'none';
      const btn = document.getElementById('btnSortear');
      btn.disabled = false;
      btn.textContent = 'SORTEAR GANADOR';
      btn.style.opacity = '1';
      document.getElementById('slotWrapper').style.display = 'none';
      winner = null;
    }

    function launchConfetti() {
      const colors = ['#25D366', '#0088FF', '#FFBD22', '#FF4444', '#fff'];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDelay = Math.random() * 0.5 + 's';
        el.style.animationDuration = (2 + Math.random() * 2) + 's';
        el.style.width = (6 + Math.random() * 8) + 'px';
        el.style.height = (6 + Math.random() * 8) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }
  </script>
