<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Directo 19 Mayo - Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #070707;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .page {
      max-width: 400px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Countdown */
    .countdown-label {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: #FF4444;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .countdown {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .cd-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 16px;
      min-width: 60px;
    }
    .cd-num {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 32px;
      line-height: 1;
    }
    .cd-unit {
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* Headline */
    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 24px;
      line-height: 1.3;
      color: #fff;
    }

    /* Sub */
    .sub {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      line-height: 1.5;
    }

    /* CTA */
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 24px;
      background: #25D366;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(37, 211, 102, 0.25);
      animation: glow 2.5s ease-in-out infinite;
    }
    .cta img { width: 20px; height: 20px; }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(37, 211, 102, 0.25); }
      50% { box-shadow: 0 0 40px rgba(37, 211, 102, 0.45); }
    }

    .note {
      font-size: 11px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="page">
    <div>
      <div class="countdown-label">Empieza en</div>
      <div class="countdown">
        <div class="cd-box"><div class="cd-num" id="h">00</div><div class="cd-unit">Horas</div></div>
        <div class="cd-box"><div class="cd-num" id="m">00</div><div class="cd-unit">Min</div></div>
        <div class="cd-box"><div class="cd-num" id="s">00</div><div class="cd-unit">Seg</div></div>
      </div>
    </div>

    <h1>Mañana a las 19h te enseño a usar IA para captar clientes en automático.</h1>

    <p class="sub">1.000 plazas. Sin replay. Sin segunda oportunidad.</p>

    <a href="https://chat.whatsapp.com/K9E9qpUdUX43iyz6TyWQfH" class="cta" target="_blank" rel="noopener">
      <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663288181369/QwFJuw59BHmTAkJvqHRxUU/whatsapp-icon_e4d4db26.png" alt="">
      ENTRAR AL GRUPO
    </a>

    <p class="note">100% gratis · Acceso inmediato</p>
  </div>

  <script>
    const t = new Date('2026-05-19T19:00:00+02:00').getTime();
    function u(){
      const d = t - Date.now();
      if(d<=0){document.getElementById('h').textContent='00';document.getElementById('m').textContent='00';document.getElementById('s').textContent='00';return;}
      document.getElementById('h').textContent=String(Math.floor(d/36e5)).padStart(2,'0');
      document.getElementById('m').textContent=String(Math.floor((d%36e5)/6e4)).padStart(2,'0');
      document.getElementById('s').textContent=String(Math.floor((d%6e4)/1e3)).padStart(2,'0');
    }
    u();setInterval(u,1000);
  </script>
</body>
</html>
